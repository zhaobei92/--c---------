name: robot-doctor-ci

on:
  push:
    branches: [master, main, "claude/robot-doctor-**"]
    paths:
      - "robot-doctor/**"
      - ".github/workflows/robot-doctor-ci.yml"
  pull_request:
    paths:
      - "robot-doctor/**"
      - ".github/workflows/robot-doctor-ci.yml"
  workflow_dispatch:

jobs:
  # Core workspace: domain, plugin host, engine, plugins, integration tests.
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: robot-doctor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: robot-doctor
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit + plugin protocol + engine integration)
        run: cargo test --workspace
      - name: Build all binaries (plugins + smoke)
        run: cargo build --workspace
      - name: Real diagnostic smoke test (system + network + NVIDIA-absence + SQLite persistence)
        run: cargo run -p integration-tests --bin smoke -- plugins
      # C2 measurement (§59). Release, because debug timings would be
      # misleading. Reported, not gated: there are no targets until there
      # is data.
      - name: Phase C2 performance measurement
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -p doctor-profile --bin measure --release

  # Real ROS 2 integration: launch actual nodes, verify RclpyProvider +
  # CLI parity + persistence through the full engine path. Two active
  # distros prove cross-distro compatibility (LTS + current).
  ros:
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, kilted]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robot-doctor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: robot-doctor
      - name: Install ROS 2 ${{ matrix.distro }}
        run: |
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update
          sudo apt-get install -y ros-${{ matrix.distro }}-ros-base \
            ros-${{ matrix.distro }}-demo-nodes-cpp ros-${{ matrix.distro }}-demo-nodes-py \
            ros-${{ matrix.distro }}-tf2-ros ros-${{ matrix.distro }}-rmw-cyclonedds-cpp
      - name: Build binaries
        run: cargo build --workspace
      - name: Real ROS integration smoke (graph, sampling, TF, diagnostics, persistence, provider parity)
        env:
          RD_ROS_SETUP: /opt/ros/${{ matrix.distro }}/setup.bash
        run: cargo run -p integration-tests --bin smoke-ros -- plugins
      # C2 acceptance scenarios 1-6 against the same live ROS graph:
      # baseline capture and restart, removed node, topic rate, TF path,
      # UNKNOWN when the runtime cannot initialize, and revision pinning.
      - name: Real ROS C2 acceptance scenarios (baseline, diff, profile evaluation)
        env:
          RD_ROS_SETUP: /opt/ros/${{ matrix.distro }}/setup.bash
        run: cargo run -p integration-tests --bin smoke-c2 -- plugins

  # Desktop app: frontend typecheck/tests/build + Tauri shell compile.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: robot-doctor/apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: robot-doctor/apps/desktop/package-lock.json
      - name: Install Linux GUI dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        working-directory: robot-doctor/apps/desktop
        run: npm ci
      - name: Frontend typecheck
        working-directory: robot-doctor/apps/desktop
        run: npm run typecheck
      - name: Frontend tests
        working-directory: robot-doctor/apps/desktop
        run: npm test
      - name: Frontend build
        working-directory: robot-doctor/apps/desktop
        run: npx vite build
      - name: Desktop shell compile
        working-directory: robot-doctor/apps/desktop/src-tauri
        run: cargo build
