name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Server tests (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "server[dev]"
      - name: Compile check (server + mock_device)
        run: python -m compileall -q server/app mock_device
      - name: Server unit + e2e tests
        run: cd server && python -m pytest -q

  mock-device:
    name: Mock device contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install fastapi httpx pytest uvicorn
      - name: Contract tests
        run: python -m pytest mock_device/tests -q

  flutter:
    name: Flutter analyze (best effort until平台工程生成)
    runs-on: ubuntu-latest
    # 平台工程(ios/、android/)由 flutter create 生成后,把 continue-on-error 移除
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze
        run: |
          cd mobile
          flutter pub get
          flutter gen-l10n
          flutter analyze
