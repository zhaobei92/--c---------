name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Server tests (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "server[dev]"
      - name: Compile check (server + mock_device)
        run: python -m compileall -q server/app mock_device
      - name: Server unit + e2e tests
        run: cd server && python -m pytest -q

  mock-device:
    name: Mock device contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install fastapi httpx pytest uvicorn email-validator
      - name: Contract tests
        run: python -m pytest mock_device/tests -q

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true
      - name: Pub get
        run: cd mobile && flutter pub get
      - name: Gen l10n
        run: cd mobile && flutter gen-l10n
      - name: Analyze (failures block the build)
        run: cd mobile && flutter analyze
      - name: Test
        run: cd mobile && flutter test

  integration:
    name: Integration (PostgreSQL + Redis + MinIO + Mailpit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ys
          POSTGRES_PASSWORD: ys
          POSTGRES_DB: ysnote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ys -d ysnote"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO (needs command override, not usable as service)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ysnote -e MINIO_ROOT_PASSWORD=ysnote-dev-secret \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break || sleep 1
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "server[dev,integration]"
      - name: Integration tests (migrations + golden chain + outbox/streams + S3 + mailpit + API-on-DB)
        env:
          SKIP_COMPOSE: "1"
          YS_DATABASE_URL: postgresql+psycopg://ys:ys@127.0.0.1:5432/ysnote
          YS_REDIS_URL: redis://127.0.0.1:6379/0
          YS_S3_ENDPOINT: http://127.0.0.1:9000
          YS_SMTP_HOST: 127.0.0.1
          YS_SMTP_PORT: "1025"
          MAILPIT_API: http://127.0.0.1:8025
        run: make verify-integration

  android-build:
    name: Android debug build (compiles Kotlin + Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true
      - name: Build debug APK
        run: cd mobile && flutter build apk --debug

  ios-build:
    name: iOS simulator build (compiles Swift + Xcode project)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true
      - name: Build for iOS simulator
        run: cd mobile && flutter build ios --simulator
