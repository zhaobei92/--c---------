# 本地/CI 集成环境:PostgreSQL + Redis + MinIO(S3 兼容)+ Mailpit(SMTP 测试)
# 数据库初始化的唯一入口是 Alembic(cd server && alembic upgrade head);
# PostgreSQL 启动为空库,禁止再挂载 schema.sql 自动建表(会与 0001 基线冲突)。
# 用法:make verify-integration
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ys
      POSTGRES_PASSWORD: ys
      POSTGRES_DB: ysnote
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ys -d ysnote"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ysnote
      MINIO_ROOT_PASSWORD: ysnote-dev-secret
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      # 用 HTTP 健康端点;`mc ready local` 依赖未配置的 alias,不可用
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]  # 1025=SMTP, 8025=HTTP API/UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      retries: 20
