# 本地/CI 集成环境:PostgreSQL + Redis + MinIO(S3 兼容)
# 用法:docker compose up -d && make verify-integration(集成测试在阶段"服务端P0修复"接入)
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ys
      POSTGRES_PASSWORD: ys
      POSTGRES_DB: ysnote
    ports: ["5432:5432"]
    volumes:
      - ./server/migrations/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ys -d ysnote"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ysnote
      MINIO_ROOT_PASSWORD: ysnote-dev-secret
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
