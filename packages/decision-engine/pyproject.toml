[project]
name = "decision-engine"
version = "0.1.0"
description = "Deterministic decision algorithms (constraints, MAUT, Monte Carlo, reopen gate) — no LLM dependency"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["decision_engine*"]
