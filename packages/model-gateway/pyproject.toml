[project]
name = "model-gateway"
version = "0.1.0"
description = "Provider-agnostic LLM gateway: model routing by role, no hard-coded model names"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "pydantic-settings>=2.1", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["model_gateway*"]
