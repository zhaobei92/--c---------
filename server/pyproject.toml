[project]
name = "ysnote-server"
version = "0.1.0"
description = "YS Note AI recorder companion app — API server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "alembic>=1.13"]
integration = [
    "psycopg[binary]>=3.1", "redis>=5", "boto3>=1.34", "alembic>=1.13",
    "requests>=2.31",
]
prod = ["psycopg[binary]>=3.1", "redis>=5", "boto3>=1.34", "alembic>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实 PostgreSQL/Redis/S3/SMTP 的测试(make verify-integration 执行)",
]
# 单元测试默认排除 integration;verify-integration 用 -m integration 反选
addopts = "-m 'not integration'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
