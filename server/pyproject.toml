[project]
name = "ysnote-server"
version = "0.1.0"
description = "YS Note AI recorder companion app — API server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
prod = ["psycopg[binary]>=3.1", "redis>=5", "boto3>=1.34"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
