name: ysnote
description: "YS Note — AI recorder companion app (project codename)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 状态管理(Clean Architecture 的 presentation/application 层)
  flutter_riverpod: ^2.5.1
  # 路由
  go_router: ^14.2.0
  # 网络
  dio: ^5.4.3
  # 本地数据库(录音元数据、同步队列、上传队列检查点)
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  # 安全存储(token)
  flutter_secure_storage: ^9.2.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 桌面/CI 环境跑 sqflite 单测
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  generate: true # l10n:zh / en / ar(RTL)
