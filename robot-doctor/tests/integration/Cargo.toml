[package]
name = "integration-tests"
description = "Cross-crate integration tests: engine + plugin protocol failure semantics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "stub-plugin"
path = "src/stub_plugin.rs"

[[bin]]
name = "smoke-ros"
path = "src/bin/smoke_ros.rs"

[lib]
name = "integration_tests"
path = "src/lib.rs"

[dependencies]
doctor-domain.workspace = true
doctor-plugin-host.workspace = true
doctor-core.workspace = true
doctor-storage.workspace = true
doctor-profile.workspace = true
plugin-ros2 = { path = "../../plugins/ros2", package = "robot-doctor-plugin-ros2" }
serde_json.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
uuid.workspace = true
