[package]
name = "robot-doctor-plugin-ros2"
description = "ROS 2 observation plugin: environment bootstrap, graph/TF/diagnostics/lifecycle/clock via rclpy or CLI providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "robot-doctor-plugin-ros2"
path = "src/main.rs"

[lib]
name = "plugin_ros2"
path = "src/lib.rs"

[dependencies]
doctor-domain.workspace = true
doctor-plugin-host.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
