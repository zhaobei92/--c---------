# Separate package (excluded from the root workspace) because it links
# platform GUI libraries (WebKitGTK / WebView2); core crates stay testable
# on headless machines. CI builds this package explicitly.
[package]
name = "robot-doctor-desktop"
description = "Robot Doctor desktop application (Tauri 2 shell over doctor-core)"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
doctor-core = { path = "../../../crates/doctor-core" }
doctor-domain = { path = "../../../crates/doctor-domain" }
doctor-storage = { path = "../../../crates/doctor-storage" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
